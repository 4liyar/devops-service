
name: Flask CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install ruff

      - name: Run automated tests
        run: python -m pytest -v

      - name: Run static code check
        run: ruff check --select E4,E7,E9,F app.py tests/

      - name: Check Python syntax
        run: python -m py_compile app.py

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build versioned Docker image
        run: |
          docker build \
            -t devops-service:${{ github.sha }} .

      - name: Export Docker image
        run: |
          docker save \
            -o devops-service-${{ github.sha }}.tar \
            devops-service:${{ github.sha }}

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-service-${{ github.sha }}
          path: devops-service-${{ github.sha }}.tar
          if-no-files-found: error
          retention-days: 30
